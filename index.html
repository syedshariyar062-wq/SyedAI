<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syed AI - Sovereign Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body {
            background-color: #0b0f19;
            color: #f8fafc;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: fixed;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        header {
            background: #111827;
            padding: 14px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
            font-size: 16px;
            font-weight: bold;
            color: #38bdf8;
            flex-shrink: 0;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background: #1f2937;
            color: #f3f4f6;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #374151;
        }
        .input-area {
            background: #111827;
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #1f2937;
            flex-shrink: 0;
            align-items: center;
        }
        input {
            flex: 1;
            background: #1f2937;
            border: 1px solid #374151;
            padding: 12px 14px;
            border-radius: 25px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button {
            background: #38bdf8;
            color: #0b0f19;
            border: none;
            padding: 0 18px;
            height: 42px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>Syed AI - Sovereign Assistant</header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">আসসালামু আলাইকুম ভাই! আমি Syed AI। বলুন, আপনাকে আজ কীভাবে সাহায্য করব?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="এখানে কিছু লিখুন..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">পাঠান</button>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            const text = inputField.value.trim();

            if (text === '') return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            chatContainer.appendChild(userDiv);

            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-message';
                aiDiv.textContent = "আপনার কথাটি পেয়েছি: \"" + text + "\"। সিস্টেম সম্পূর্ণ স্বাধীন ও সচল আছে!";
                chatContainer.appendChild(aiDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 500);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
